<main class="workspace">
  <div class="toolbar">
    <label class="toolbar-label" for="exampleSelect">Example</label>
    <select id="exampleSelect" aria-label="Load an example program"></select>
    <button type="button" class="btn btn-primary" id="runBtn">Run</button>
    <button type="button" class="btn btn-stop" id="stopBtn" disabled>Stop</button>
    <button type="button" class="btn btn-ghost" id="clearBtn">Clear console</button>
    <span class="toolbar-spacer"></span>
    <span class="toolbar-hint">IGCSE 2210 pseudocode · runs in your browser</span>
  </div>
  <div class="split">
    <section class="pane pane-editor" aria-label="Pseudocode editor">
      <div class="pane-label">Editor</div>
      <div id="editor">
        <textarea id="codeInput" class="plain-textarea" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Pseudocode editor"></textarea>
      </div>
    </section>
    <section class="pane pane-console" aria-label="Program output">
      <div class="pane-label">Console</div>
      <div id="console" class="console" role="log" aria-live="polite"></div>
    </section>
  </div>
</main>
